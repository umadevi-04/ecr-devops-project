<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{% block title %}DevShop{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

<header>

    <div class="navbar">

        <a href="{{ url_for('home') }}" class="logo">
            🛒 DevShop
        </a>

        <nav>

            <a href="{{ url_for('home') }}">
                Home
            </a>

            <a href="{{ url_for('product_list') }}">
                Products
            </a>

            <a href="{{ url_for('cart') }}">
                Cart 🛒
            </a>

        </nav>

    </div>

</header>


<main>

    {% block content %}
    {% endblock %}

</main>


<footer>

    <p>
        DevShop — AWS DevOps Demo Application
    </p>

</footer>

</body>

</html>
