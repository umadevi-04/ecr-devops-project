{% extends "base.html" %}

{% block title %}DevShop - Products{% endblock %}

{% block content %}

<section class="products-section">

    <h1>All Products</h1>

    <div class="product-grid">

        {% for product in products %}

        <div class="product-card">

            <img
                src="{{ product.image }}"
                alt="{{ product.name }}"
            >

            <div class="product-info">

                <h2>{{ product.name }}</h2>

                <p class="price">
                    ₹{{ "{:,}".format(product.price) }}
                </p>

                <p>
                    {{ product.description }}
                </p>

                <a
                    href="{{ url_for('product_detail', product_id=product.id) }}"
                    class="button"
                >
                    View Details
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</section>

{% endblock %}
