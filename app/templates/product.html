cat > app/templates/product.html <<'EOF'
{% extends "base.html" %}

{% block title %}{{ product.name }} - DevShop{% endblock %}

{% block content %}

<section class="product-detail">

    <div class="product-image">
        <img src="{{ product.image }}" alt="{{ product.name }}">
    </div>

    <div class="product-info">

        <h1>{{ product.name }}</h1>

        <p class="price">₹{{ "{:,.0f}".format(product.price) }}</p>

        <p class="description">
            {{ product.description }}
        </p>

        <a
            href="{{ url_for('add_to_cart', product_id=product.id) }}"
            class="btn"
        >
            Add to Cart
        </a>

        <a
            href="{{ url_for('product_list') }}"
            class="back-link"
        >
            ← Back to Products
        </a>

    </div>

</section>

{% endblock %}
EOF
